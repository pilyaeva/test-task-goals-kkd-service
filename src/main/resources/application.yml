spring:
  config:
    # локальный запуск (IDE, spring-boot:run): подхватить переменные из .env в рабочем каталоге;
    # переменные окружения (docker compose) имеют приоритет
    import: optional:file:.env[.properties]
  application:
    name: test-task-goals-kkd-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkd}
    username: ${DB_USER:kkd}
    password: ${DB_PASSWORD}
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
