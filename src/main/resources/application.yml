spring:
  application:
    name: test-task-goals-kkd-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkd}
    username: ${DB_USER:kkd}
    password: ${DB_PASSWORD:kkd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
