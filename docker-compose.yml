services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kkd
      POSTGRES_USER: ${DB_USER:-kkd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ хранит данные в /var/lib/postgresql/<версия>
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/kkd
      DB_USER: ${DB_USER:-kkd}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data:
